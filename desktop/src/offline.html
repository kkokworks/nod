<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>nod</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        line-height: 1.6;
      }
      pre {
        overflow-x: auto;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        background: rgb(127 127 127 / 0.12);
      }
      #status {
        margin-left: 0.75rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>화면 서버가 떠 있지 않습니다</h1>
      <p>
        이 앱은 <code>http://127.0.0.1:4800</code> 의 nod 화면 서버를 보여 줍니다. 서버가 뜨면 이
        창이 저절로 그 화면으로 넘어갑니다. nod 레포에서 서버를 띄웁니다.
      </p>
      <pre>sh desktop/launchd/ui.sh install   # 로그인할 때마다 띄우기
cd ui &amp;&amp; bun run dev               # 지금 한 번만 띄우기</pre>
      <button id="retry" type="button">다시 시도</button><span id="status"></span>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
